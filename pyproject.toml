[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aioimmich"
version = "0.18.0"
description = "Asynchronous library to fetch albums and assests from immich."
authors = [{ name = "mib1185" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = '>=3.11'
dependencies = ["aiofiles", "aiohttp", "mashumaro"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "aiointercept==1.0.0",
    "black==26.10.1",
    "mypy==2.4.1",
    "pdoc3==0.11.6",
    "pre-commit-hooks==6.0.0",
    "prek==0.5.9",
    "pylint==4.1.3",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "pytest==9.2.0",
    "reorder-python-imports==3.19.0",
    "syrupy",
]

[project.urls]
homepage = 'https://github.com/mib1185/aioimmich'
repository = 'https://github.com/mib1185/aioimmich'

[tool.setuptools]
package-data = { "aioimmich" = ["py.typed"] }
platforms = ["any"]

[tool.setuptools.packages.find]
include = ["aioimmich*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
